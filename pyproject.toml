[project]
name = "newsreel-v1"
version = "0.1.0"
description = "Local-first French newsreel generator with batched FastH3 rendering"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["newsreel_ltx_bridge.py", "newsreel_ltx_modal.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
